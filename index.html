<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Formula ❤️</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --accent-math: #61dafb;
            --heart-base: #f87171; /* Base outline color */
            --text-main: #c9d1d9;
            --text-sub: #8b949e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* --- Equation Section --- */
        #intro-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
            position: absolute;
            z-index: 10;
        }

        .equation {
            font-family: "Courier New", Courier, monospace;
            font-size: 2.2rem;
            color: var(--accent-math);
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(97, 218, 251, 0.5);
        }

        .intro-text { color: var(--text-sub); font-size: 1rem; }

        /* --- Heart Section --- */
        #main-container {
            position: relative;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            visibility: hidden;
        }

        canvas { display: block; }

        /* --- Message Section (You liked this!) --- */
        .final-message {
            margin-top: 25px;
            color: var(--text-main);
            font-size: 1.25rem;
            font-weight: 500;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            text-align: center;
            max-width: 380px;
            line-height: 1.6;
            padding: 0 20px;
        }

        .show { opacity: 1 !important; visibility: visible !important; }
    </style>
</head>
<body>

    <div id="intro-container">
        <div class="equation"><i>e</i><sup><i>iπ</i></sup> + 1 = 0</div>
        <p class="intro-text">Euler's Identity: Pure elegant logic.</p>
    </div>

    <div id="main-container">
        <canvas id="heartCanvas"></canvas>
        <p class="final-message" id="endText">
            Yesterday was completely messed up at the hospital, but even in that room, I was thinking about you the whole time.
            <br><br>
            Made this from scratch late last night. Happy GF Day. 
            <br>
            <span style="color:var(--text-sub); font-size: 0.95rem;">(I'll make up for the date properly later.)</span>
        </p>
    </div>

    <script>
        const introContainer = document.getElementById('intro-container');
        const mainContainer = document.getElementById('main-container');
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const endText = document.getElementById('endText');

        // Original colorful list from your Python code
        const colors = ["red", "blue", "lime", "yellow", "cyan", "magenta", "orange", "pink"];

        const displaySize = Math.min(window.innerWidth - 30, 380);
        canvas.width = displaySize;
        canvas.height = displaySize;

        // --- Core Flow ---

        setTimeout(() => { introContainer.style.opacity = '0'; }, 3000);

        setTimeout(() => {
            introContainer.style.display = 'none';
            mainContainer.classList.add('show');
            startCorrectedHeartDrawing();
        }, 4500);

        // --- Fixing the Drawing Logic ---

        function startCorrectedHeartDrawing() {
            ctx.translate(displaySize / 2, displaySize / 2);

            let i = 0;
            const totalSteps = 120;
            const scale = displaySize / 35;
            
            // SLOWER DRAWING SPEED
            const frameDelay = 65; // Milliseconds per step (higher number = slower draw)

            // Setup the base outline glow (This keeps the shape held!)
            ctx.strokeStyle = '#f87171'; // --heart-base
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.shadowColor = 'rgba(248, 113, 113, 0.4)'; // Glow
            ctx.shadowBlur = 10;

            function getHeartCoords(t) {
                const angle = t * (Math.PI * 2) / totalSteps;
                const x = 16 * Math.pow(Math.sin(angle), 3) * scale;
                const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * scale;
                return {x, y};
            }

            function drawStep() {
                if (i >= totalSteps) {
                    // All steps complete: Keep the heart glowing and show message
                    ctx.shadowBlur = 15; // Pulse glow slightly at end
                    endText.classList.add('show');
                    return; 
                }

                // 1. Draw the smooth, connected outline (The shape)
                ctx.beginPath();
                // Get coords for *previous* point and *current* point to connect them
                const prev = (i === 0) ? getHeartCoords(0) : getHeartCoords(i-1);
                const current = getHeartCoords(i);

                ctx.moveTo(prev.x, prev.y);
                ctx.lineTo(current.x, current.y);
                ctx.stroke(); // Draws the outline connection

                // 2. Draw the colorful Starburst (The flash)
                // We draw the burst *at* the current outline point (x,y)
                
                // Save outline state, switch to colorful state
                ctx.save();
                ctx.shadowBlur = 0; // Disable shadow for burst for clarity
                const color = colors[Math.floor(Math.random() * colors.length)];
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;

                // Burst Logic (8 pointed star)
                const bursts = 8;
                const burstRadius = 8 * (displaySize / 380); // Small relative burst
                
                ctx.translate(current.x, current.y); // Relative center for burst
                
                for (let b = 0; b < bursts; b++) {
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(burstRadius, 0);
                    ctx.stroke();
                    ctx.rotate((45 * Math.PI) / 180);
                }
                ctx.restore(); // Back to outline state

                i++;
                // Slower delay for the next step
                setTimeout(drawStep, frameDelay);
            }

            drawStep();
        }
    </script>
</body>
</html>
