<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Formula ❤️</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --accent-main: #61dafb;
            --heart-color: #f87171;
            --text-main: #c9d1d9;
            --text-sub: #8b949e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #intro-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
            position: absolute;
            z-index: 10;
        }

        .equation {
            font-family: "Courier New", Courier, monospace;
            font-size: 2.2rem;
            color: var(--accent-main);
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(97, 218, 251, 0.5);
        }

        .intro-text {
            color: var(--text-sub);
            font-size: 1rem;
        }

        #main-container {
            position: relative;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
        }

        .final-message {
            margin-top: 20px;
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 500;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            text-align: center;
            max-width: 350px;
            line-height: 1.5;
            padding: 0 20px;
        }

        .show {
            opacity: 1 !important;
        }
    </style>
</head>
<body>

    <div id="intro-container">
        <div class="equation">
            <i>e</i><sup><i>iπ</i></sup> + 1 = 0
        </div>
        <p class="intro-text">Euler's Identity: Pure elegant logic.</p>
    </div>

    <div id="main-container">
        <canvas id="heartCanvas"></canvas>
        <p class="final-message" id="endText">
            Some things don't need an equation to make sense. <br><br>
            Love you, man.
        </p>
    </div>

    <script>
        const introContainer = document.getElementById('intro-container');
        const mainContainer = document.getElementById('main-container');
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const endText = document.getElementById('endText');

        // Dynamic sizing for mobile screen
        const displaySize = Math.min(window.innerWidth - 40, 350);
        canvas.width = displaySize;
        canvas.height = displaySize;

        ctx.strokeStyle = '#f87171';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';

        // 1. Fade out equation after 3 seconds
        setTimeout(() => {
            introContainer.style.opacity = '0';
        }, 3000);

        // 2. Hide intro, show canvas, start drawing heart
        setTimeout(() => {
            introContainer.style.display = 'none';
            mainContainer.classList.add('show');
            startHeartDrawing();
        }, 4500);

        function startHeartDrawing() {
            ctx.translate(displaySize / 2, displaySize / 2);

            let t = 0;
            const speed = 0.03; 
            const scale = displaySize / 32; 

            function drawStep() {
                const x = 16 * Math.pow(Math.sin(t), 3) * scale;
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;

                if (t === 0) {
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                    ctx.stroke();
                }

                t += speed;

                if (t <= 2 * Math.PI) {
                    requestAnimationFrame(drawStep);
                } else {
                    // Show final text when heart finishes drawing
                    endText.classList.add('show');
                }
            }

            drawStep();
        }
    </script>
</body>
</html>
